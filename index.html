<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Dragon Ball Radar</title>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: white; z-index: 2; }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* deja pasar toques al entorno AR */
    }

    .overlay-ui {
      position: absolute;
      color: #0f0;
      font-size: 18px;
      font-family: sans-serif;
      pointer-events: none;
    }

    #counter {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 15px;
      background: rgba(0, 0, 0, 0.5);
      color: #0f0;
      font-size: 18px;
      border: 2px solid #0f0;
      border-radius: 8px;
      z-index: 9999;
    }


    #radar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0, 30, 0, 0.6);
      border: 2px solid #0f0;
      z-index: 9999;
    }
  </style>
</head>
<body>
<div id="overlay">
    <canvas id="radar" width="200" height="200"></canvas>
    <div id="counter" class="overlay-ui">Bolas capturadas: 0</div>
</div>

<script type="module">

  import * as THREE from 'https://esm.run/three@0.164.0';
  import { GLTFLoader  } from 'https://esm.run/three@0.164.0/examples/jsm/loaders/GLTFLoader.js';
  import { ARButton } from 'https://esm.run/three@0.164.0/examples/jsm/webxr/ARButton.js';
  import { PMREMGenerator } from 'https://esm.run/three@0.164.0/src/extras/PMREMGenerator.js';
  import { RoomEnvironment } from 'https://esm.run/three@0.164.0/examples/jsm/environments/RoomEnvironment.js';


    let dragonBallSet = [];
    let dragonBalls = [];    
    let currentBall = 0; 

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let portalPlaced = false;

    const captureSound = new Audio('capture.wav');
    const shenronSound = new Audio('shenron_sound.mp3');
    let capturedCount = 0;
    let shenronLoaded = false;
    let shenronModel = null;

    init();
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // Reticle
      const ringGeo = new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI/2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Controller (opcional si quieres tocar para colocar también)
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // ARButton
      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test', 'dom-overlay'],
        // Anadir el radar en el modo AR
        domOverlay: { root: document.getElementById('overlay') }
      }));

      window.addEventListener('resize', onWindowResize);
    }

    const loader = new GLTFLoader();


    loader.load(
      'esferas_del_dragon__dragon_balls.glb',
      gltf => {
        const root = gltf.scene;


      root.traverse(obj => {
        if (obj.isMesh) {
          const data = obj.material.userData.gltfExtensions?.KHR_materials_pbrSpecularGlossiness;
          if (data) {
            const [r, g, b] = data.diffuseFactor;
            obj.material.color.setRGB(r, g, b);
          }

        obj.material.envMapIntensity = 1.5;

        console.log('Procesando objeto:', obj.name);
        if (obj.isMesh) {
          const data = obj.material.userData.gltfExtensions?.KHR_materials_pbrSpecularGlossiness;
          if (data) {
            const [r, g, b] = data.diffuseFactor;
            obj.material.color.setRGB(r, g, b);
          }

          obj.material.envMapIntensity = 1.5;
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.material.needsUpdate = true;

          // Esferas
          if (/object_5|object_8|object_11|object_14|object_17|object_20|object_23/i.test(obj.name)) {
            obj.material.transparent = true;
            obj.material.opacity = 0.55;
            obj.material.depthWrite = false; // No bloquean las estrellas
            obj.renderOrder = 1; // Se dibujan primero
          // Estrellas
          } else {
            obj.material.depthTest = false;  // no se ocultan por la esfera
            obj.material.emissive = new THREE.Color(0xff0000); // 🔥 rojo puro
            obj.material.emissiveIntensity = 6;                // 💡 mucho más brillo
            obj.material.color.set(0xff3300);                  // color base anaranjado/rojo
            obj.material.metalness = 0.2;                      // un poco metálico
            obj.material.roughness = 0.1;                      // superficie brillante
            obj.material.envMapIntensity = 2.5;                // reflejos más fuertes
            obj.material.toneMapped = false;                   // evita que el bloom atenúe el rojo
            obj.renderOrder = 2;
            obj.material.needsUpdate = true;
          }
        }

        obj.castShadow = true;
        obj.receiveShadow = true;
        obj.material.needsUpdate = true;
      }
    });

        console.log('Modelo cargado:', root);

        root.children[0].children[0].children[0].children.forEach(child => {
          if (/Estrella/i.test(child.name)) {
            dragonBallSet.push(child);
          }
        });

        console.log('Total bolas:', dragonBallSet.length); // debería ser 7
      },
      xhr => console.log((xhr.loaded / xhr.total * 100) + '% cargado'),
      err => console.error('Error al cargar modelo:', err)
    );

    function onSelect() {
      if (reticle.visible) {
        placePortal();
      }
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- RADAR CONFIG ---
const radarCanvas = document.getElementById('radar');
const radarCtx = radarCanvas.getContext('2d');

// Tamaño y radio del radar
const radarSize = 200;
const radarRadius = 80;

// Actualiza radar en cada frame
function updateRadar() {
  radarCtx.clearRect(0, 0, radarSize, radarSize);

  // Fondo
  radarCtx.fillStyle = 'rgba(0, 60, 0, 0.8)';
  radarCtx.beginPath();
  radarCtx.arc(radarSize/2, radarSize/2, radarRadius, 0, Math.PI * 2);
  radarCtx.fill();

  // Rejilla
  radarCtx.strokeStyle = 'rgba(0,255,0,0.3)';
  radarCtx.lineWidth = 1;
  for (let r = 20; r <= radarRadius; r += 20) {
    radarCtx.beginPath();
    radarCtx.arc(radarSize/2, radarSize/2, r, 0, Math.PI * 2);
    radarCtx.stroke();
  }

  // Jugador (centro)
  const playerPos = new THREE.Vector3();
  camera.getWorldPosition(playerPos);

  // Calcular posiciones relativas de todas las bolas
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  let closestBall = null;
  let closestDist = Infinity;
  const ballData = [];

  dragonBalls.forEach(ball => {
    const ballPos = new THREE.Vector3();
    ball.getWorldPosition(ballPos);
    const relative = ballPos.clone().sub(playerPos);

    const angle = Math.atan2(
      relative.x * forward.z - relative.z * forward.x,
      relative.x * forward.x + relative.z * forward.z
    );

    const dist = relative.length();
    ballData.push({ angle, dist });
    if (dist < closestDist) {
      closestDist = dist;
      closestBall = { angle, dist };
    }
  });

  // Dibuja todas las bolas (puntos naranjas)
  ballData.forEach(({ angle, dist }) => {
    const scaledDist = Math.min(dist * 2, radarRadius);
    const x = radarSize / 2 + Math.sin(angle) * scaledDist;
    const y = radarSize / 2 - Math.cos(angle) * scaledDist;

    radarCtx.fillStyle = 'rgb(255,165,0)';
    radarCtx.beginPath();
    radarCtx.arc(x, y, 6, 0, Math.PI * 2);
    radarCtx.fill();
    radarCtx.strokeStyle = 'rgba(255,255,0,0.7)';
    radarCtx.stroke();
  });

  // Triángulo indicador hacia la bola más cercana
  if (closestBall) {
    const dirAngle = closestBall.angle;
    const scaledDist = Math.min(closestBall.dist * 2, radarRadius - 10);

    const cx = radarSize / 2 + Math.sin(dirAngle) * scaledDist;
    const cy = radarSize / 2 - Math.cos(dirAngle) * scaledDist;

    radarCtx.fillStyle = 'lime';
    radarCtx.beginPath();
    radarCtx.moveTo(cx, cy);
    radarCtx.lineTo(
      cx - 6 * Math.cos(dirAngle - Math.PI / 2),
      cy - 6 * Math.sin(dirAngle - Math.PI / 2)
    );
    radarCtx.lineTo(
      cx - 6 * Math.cos(dirAngle + Math.PI / 2),
      cy - 6 * Math.sin(dirAngle + Math.PI / 2)
    );
    radarCtx.closePath();
    radarCtx.fill();
  }

  // Línea frontal del jugador
  radarCtx.strokeStyle = 'rgba(0,255,0,0.6)';
  radarCtx.beginPath();
  radarCtx.moveTo(radarSize/2, radarSize/2);
  radarCtx.lineTo(radarSize/2, radarSize/2 - radarRadius);
  radarCtx.stroke();

  // Punto del jugador
  radarCtx.fillStyle = 'lime';
  radarCtx.beginPath();
  radarCtx.arc(radarSize/2, radarSize/2, 4, 0, Math.PI * 2);
  radarCtx.fill();
}


    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (hitTestSourceRequested === false) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      const playerPos = new THREE.Vector3();
      camera.getWorldPosition(playerPos);

      for (let i = dragonBalls.length - 1; i >= 0; i--) {
        const ball = dragonBalls[i];
        if (ball.capturing) continue; // evita doble captura

        const ballPos = new THREE.Vector3();
        ball.getWorldPosition(ballPos);
        const distance = playerPos.distanceTo(ballPos);

        if (distance < 0.4) {
          ball.capturing = true;
          let opacity = 1;

          const fade = setInterval(() => {
            opacity -= 0.1;
            ball.traverse(child => {
              if (child.isMesh) {
                child.material.transparent = true;
                child.material.opacity = Math.max(opacity, 0);
              }
            });

            if (opacity <= 0) {
              clearInterval(fade);
              scene.remove(ball);
              dragonBalls.splice(i, 1);
              captureSound.currentTime = 0;
              captureSound.play();
              console.log('Bola capturada! Quedan:', dragonBalls.length);
              capturedCount++;
              document.getElementById('counter').innerText = `Bolas capturadas: ${capturedCount}`;

              if (capturedCount === 7 && !shenronLoaded) {
                shenronLoaded = true;
                showShenron();
              }
            }
          }, 50);
        }
      }

      updateRadar();
      renderer.render(scene, camera);
    });

  function showShenron() {
  console.log("¡Has reunido las 7 esferas del dragón!");

  const loader = new GLTFLoader();
  loader.load(
    'shenron_dragon_ball.glb', // <-- asegúrate de tener este archivo en la misma carpeta
    gltf => {
      shenronModel = gltf.scene;

      // Ajustar tamaño y posición
      shenronModel.scale.set(0.05, 0.05, 0.05);
      shenronModel.position.set(0, -0.5, -1.5); // un poco delante de la cámara

      // Animación inicial (aparecer desde abajo)
      shenronModel.traverse(obj => {
        if (obj.isMesh) {
          obj.material.transparent = true;
          obj.material.opacity = 0;
        }
      });

      scene.add(shenronModel);
      shenronSound.currentTime = 0;
      shenronSound.play();

      // Efecto de aparición progresiva
      let opacity = 0;
      const fadeIn = setInterval(() => {
        opacity += 0.05;
        shenronModel.traverse(obj => {
          if (obj.isMesh) obj.material.opacity = Math.min(opacity, 1);
        });

        if (opacity >= 1) clearInterval(fadeIn);
      }, 80);

      // Mensaje en pantalla
      const msg = document.createElement('div');
      msg.id = 'shenronMessage';
      msg.innerText = '¡Has reunido las 7 esferas del dragón!';
      msg.style.position = 'absolute';
      msg.style.top = '50%';
      msg.style.left = '50%';
      msg.style.transform = 'translate(-50%, -50%)';
      msg.style.color = '#0f0';
      msg.style.fontSize = '22px';
      msg.style.fontWeight = 'bold';
      msg.style.textShadow = '0 0 10px #0f0';
      msg.style.background = 'rgba(0,0,0,0.5)';
      msg.style.padding = '12px 20px';
      msg.style.border = '2px solid #0f0';
      msg.style.borderRadius = '8px';
      msg.style.zIndex = '10000';
      msg.style.opacity = 0;
      msg.style.transition = 'opacity 1s';
      document.getElementById('overlay').appendChild(msg);

      // Desaparecer mensaje después de unos segundos
      setTimeout(() => { msg.style.opacity = 1; }, 100); // fade-in
      setTimeout(() => { msg.style.opacity = 0; msg.remove(); }, 6000);
    },
    xhr => console.log((xhr.loaded / xhr.total * 100) + '% cargado Shenron'),
    err => console.error('Error al cargar Shenron:', err)
  );
}


  function placePortal() {
  if (dragonBallSet.length === 0) return;

  const original = dragonBallSet[currentBall];
  const ball = original.clone(true);

  // 🔁 Clonar materiales individuales para que no se compartan entre bolas
  ball.traverse(child => {
    if (child.isMesh && child.material) {
      child.material = child.material.clone();
    }
  });

  ball.scale.set(0.1, 0.1, 0.1);

  const pos = new THREE.Vector3(0, 0, -0.5).applyMatrix4(controller.matrixWorld);
  ball.position.copy(pos);

  // mantener máximo 7 bolas
  if (dragonBalls.length >= 7) {
    const oldBall = dragonBalls.shift();
    scene.remove(oldBall);
  }

  scene.add(ball);
  dragonBalls.push(ball);

  console.log(`Colocada la bola ${currentBall + 1}`);
  currentBall = (currentBall + 1) % dragonBallSet.length;
}


</script>
</body>
