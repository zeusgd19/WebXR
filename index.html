<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Dragon Ball Radar</title>
  <style>
    body { margin:0; overflow:hidden; font-family:sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: white; z-index: 2; }
  </style>
</head>
<body>
<div id="info">Ancla las bolas de dragon en algun punto del entorno y encuentralas usando el radar de dragon</div>

<canvas id="radar" width="200" height="200"></canvas>

<script type="module">

  import * as THREE from 'https://esm.run/three@0.164.0';
import { GLTFLoader } from 'https://esm.run/three@0.164.0/examples/jsm/loaders/GLTFLoader.js';
import { ARButton } from 'https://esm.run/three@0.164.0/examples/jsm/webxr/ARButton.js';
import { PMREMGenerator } from 'https://esm.run/three@0.164.0/src/extras/PMREMGenerator.js';
import { RoomEnvironment } from 'https://esm.run/three@0.164.0/examples/jsm/environments/RoomEnvironment.js';


    let dragonBallSet = [];
    let dragonBalls = [];    
    let currentBall = 0; 

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let portalPlaced = false;

    init();
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // Reticle
      const ringGeo = new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI/2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Controller (opcional si quieres tocar para colocar también)
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // ARButton
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      window.addEventListener('resize', onWindowResize);
    }

    const loader = new GLTFLoader();

    loader.load(
  'esferas_del_dragon__dragon_balls.glb',
  gltf => {
    const root = gltf.scene;


    root.traverse(obj => {
  if (obj.isMesh) {
    // aplicar entorno para que el material refleje
    obj.material.envMapIntensity = 1.5;

    // si quieres que la esfera se vea un poco translúcida
    if (obj.name.toLowerCase().includes("estrella")) {
      obj.material.transparent = true;
      obj.material.opacity = 0.9;
      obj.material.side = THREE.DoubleSide;
    }

    obj.castShadow = true;
    obj.receiveShadow = true;
  }
});

    console.log('Modelo cargado:', root);

    root.children[0].children[0].children[0].children.forEach(child => {
      if (/Estrella/i.test(child.name)) {
        dragonBallSet.push(child);
      }
    });

    console.log('Total bolas:', dragonBallSet.length); // debería ser 7
  },
  xhr => console.log((xhr.loaded / xhr.total * 100) + '% cargado'),
  err => console.error('Error al cargar modelo:', err)
);

    function onSelect() {
      if (reticle.visible && !portalPlaced) {
        placePortal();
      }
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 🔹 Bucle de render y detección de planos
renderer.setAnimationLoop((timestamp, frame) => {
  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (hitTestSourceRequested === false) {
      session.requestReferenceSpace('viewer').then((refSpace) => {
        session.requestHitTestSource({ space: refSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
});

// 🔹 Colocar una bola cuando se toca
function placePortal() {
   if (dragonBallSet.length === 0) return;

  const original = dragonBallSet[currentBall];
  const ball = original.clone(true); // 👈 clona todo el grupo
  ball.scale.set(0.1, 0.1, 0.1);

  const pos = new THREE.Vector3(0, 0, -0.5).applyMatrix4(controller.matrixWorld);
  ball.position.copy(pos);

  scene.add(ball);
  dragonBalls.push(ball);

  console.log(`Colocada la bola ${currentBall + 1}⭐`);
  currentBall = (currentBall + 1) % dragonBallSet.length;
}


</script>
</body>
